version: "3.9"

services:
  db:
    image: ankane/pgvector
    container_name: postgres_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my126403
      POSTGRES_DB: fyp_clothing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: