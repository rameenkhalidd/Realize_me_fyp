version: "3.9"

services:
  db:
    image: ankane/pgvector
    container_name: postgres_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my126403
      POSTGRES_DB: fyp_clothing_db
    ports:
      # Use 5433 on the host so FastAPI/psycopg2 does not hit a local Windows Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: